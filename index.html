<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f7fb">
  <meta name="description" content="A simple, friendly to-do list that keeps your tasks saved on this device.">
  <title>Little List — To-do</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #20243a;
      --muted: #81869a;
      --line: #eceef4;
      --purple: #7258e8;
      --purple-dark: #5b43cf;
      --surface: #fff;
      --page: #f6f7fb;
      --shadow: 0 20px 60px rgb(42 45 80 / 9%);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 48px 20px;
      background: radial-gradient(ellipse at 50% 0%, #eeebff 0, transparent 38%), var(--page);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    button, input { font: inherit; }
    button { color: inherit; }
    .app { width: min(100%, 680px); margin: 0 auto; }
    .intro { margin: 0 0 28px; text-align: center; }
    .eyebrow { margin: 0 0 10px; color: var(--purple); font-size: .76rem; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(2.2rem, 7vw, 3.25rem); letter-spacing: -.055em; line-height: 1.05; }
    .subtitle { margin: 12px 0 0; color: var(--muted); font-size: 1rem; }
    .card { overflow: hidden; border: 1px solid rgb(226 228 238 / 75%); border-radius: 22px; background: var(--surface); box-shadow: var(--shadow); }
    .composer { display: flex; gap: 10px; padding: 22px; border-bottom: 1px solid var(--line); }
    .composer input { min-width: 0; flex: 1; padding: 13px 15px; border: 1px solid #e4e6ef; border-radius: 12px; outline: none; background: #fbfbfd; color: var(--ink); transition: border-color .2s, box-shadow .2s; }
    .composer input::placeholder { color: #a4a8b7; }
    .composer input:focus { border-color: var(--purple); box-shadow: 0 0 0 3px rgb(114 88 232 / 13%); }
    .add-button { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 0 18px; border: 0; border-radius: 12px; background: var(--purple); color: white; font-weight: 750; cursor: pointer; transition: background .2s, transform .2s; }
    .add-button:hover { transform: translateY(-1px); background: var(--purple-dark); }
    .add-button:active { transform: translateY(0); }
    .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 15px 22px; border-bottom: 1px solid var(--line); }
    .filters { display: flex; gap: 4px; }
    .filter { padding: 8px 11px; border: 0; border-radius: 9px; background: transparent; color: var(--muted); font-size: .88rem; font-weight: 650; cursor: pointer; }
    .filter:hover { background: #f7f6ff; color: var(--purple); }
    .filter[aria-pressed="true"] { background: #f0edff; color: var(--purple-dark); }
    .count { color: var(--muted); font-size: .84rem; white-space: nowrap; }
    .task-list { min-height: 224px; margin: 0; padding: 4px 22px; list-style: none; }
    .task { display: flex; align-items: center; gap: 13px; min-height: 67px; border-bottom: 1px solid var(--line); animation: arrive .22s ease-out; }
    .task:last-child { border-bottom: 0; }
    @keyframes arrive { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    .check { display: grid; width: 22px; height: 22px; flex: 0 0 22px; place-items: center; padding: 0; border: 1.7px solid #cdd0dc; border-radius: 50%; background: white; color: white; cursor: pointer; transition: .18s; }
    .check:hover { border-color: var(--purple); }
    .task.done .check { border-color: var(--purple); background: var(--purple); }
    .check svg { width: 13px; height: 13px; }
    .task-text { min-width: 0; flex: 1; overflow-wrap: anywhere; font-size: .98rem; line-height: 1.45; }
    .task.done .task-text { color: #a2a5b2; text-decoration: line-through; text-decoration-thickness: 1.5px; }
    .delete { display: grid; width: 34px; height: 34px; flex: 0 0 34px; place-items: center; border: 0; border-radius: 9px; background: transparent; color: #a4a8b7; cursor: pointer; opacity: 0; transition: .18s; }
    .task:hover .delete, .delete:focus-visible { background: #fff0f1; color: #d35264; opacity: 1; }
    .delete svg { width: 17px; height: 17px; }
    .empty { display: grid; min-height: 216px; place-content: center; padding: 28px; color: var(--muted); text-align: center; }
    .empty-icon { margin-bottom: 12px; font-size: 2rem; }
    .empty strong { color: var(--ink); font-size: 1rem; }
    .empty p { margin: 6px 0 0; font-size: .9rem; }
    .footer { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 15px 22px; border-top: 1px solid var(--line); color: var(--muted); font-size: .83rem; }
    .clear-button { padding: 6px 0; border: 0; background: transparent; color: var(--muted); cursor: pointer; }
    .clear-button:hover:not(:disabled) { color: #d35264; }
    .clear-button:disabled { cursor: default; opacity: .42; }
    .tip { margin: 18px 0 0; color: #a0a4b4; font-size: .8rem; text-align: center; }
    button:focus-visible { outline: 3px solid rgb(114 88 232 / 35%); outline-offset: 2px; }
    @media (max-width: 480px) {
      body { padding: 32px 13px; }
      .composer { gap: 8px; padding: 15px; }
      .add-button { padding: 0 13px; }
      .toolbar, .footer { padding-right: 15px; padding-left: 15px; }
      .task-list { padding-right: 15px; padding-left: 15px; }
      .filter { padding: 8px; font-size: .82rem; }
      .count { font-size: .78rem; }
      .delete { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <main class="app">
    <header class="intro">
      <p class="eyebrow">A little more focus</p>
      <h1>Little List<span aria-hidden="true"> ✳</span></h1>
      <p class="subtitle">Make room for what matters today.</p>
    </header>

    <section class="card" aria-label="To-do list">
      <form class="composer" id="task-form">
        <input id="task-input" type="text" placeholder="What needs to get done?" maxlength="200" autocomplete="off" aria-label="New task" required>
        <button class="add-button" type="submit"><span aria-hidden="true">＋</span> Add task</button>
      </form>
      <div class="toolbar">
        <nav class="filters" aria-label="Filter tasks">
          <button class="filter" type="button" data-filter="all" aria-pressed="true">All</button>
          <button class="filter" type="button" data-filter="active" aria-pressed="false">Active</button>
          <button class="filter" type="button" data-filter="completed" aria-pressed="false">Done</button>
        </nav>
        <span class="count" id="count" aria-live="polite"></span>
      </div>
      <ul class="task-list" id="task-list" aria-label="Tasks"></ul>
      <footer class="footer">
        <span>One thing at a time ✨</span>
        <button class="clear-button" id="clear-completed" type="button">Clear completed</button>
      </footer>
    </section>
    <p class="tip">Your list is saved automatically on this device.</p>
  </main>

  <script>
    (() => {
      const STORAGE_KEY = 'little-list-tasks-v1';
      const form = document.querySelector('#task-form');
      const input = document.querySelector('#task-input');
      const list = document.querySelector('#task-list');
      const count = document.querySelector('#count');
      const clearButton = document.querySelector('#clear-completed');
      const filters = [...document.querySelectorAll('.filter')];
      let activeFilter = 'all';
      let tasks = loadTasks();

      function loadTasks() {
        try {
          const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
          return Array.isArray(saved) ? saved.filter(task => task && typeof task.id === 'string' && typeof task.text === 'string' && typeof task.completed === 'boolean') : [];
        } catch {
          return [];
        }
      }

      function saveTasks() {
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks)); }
        catch { /* The app remains usable when browser storage is unavailable. */ }
      }

      function iconCheck() {
        const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        svg.setAttribute('viewBox', '0 0 16 16');
        svg.setAttribute('fill', 'none');
        svg.setAttribute('aria-hidden', 'true');
        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        path.setAttribute('d', 'm3 8 3.2 3.2L13 4.5');
        path.setAttribute('stroke', 'currentColor');
        path.setAttribute('stroke-width', '2');
        path.setAttribute('stroke-linecap', 'round');
        path.setAttribute('stroke-linejoin', 'round');
        svg.append(path);
        return svg;
      }

      function makeTask(task) {
        const item = document.createElement('li');
        item.className = `task${task.completed ? ' done' : ''}`;
        const check = document.createElement('button');
        check.className = 'check';
        check.type = 'button';
        check.setAttribute('aria-label', task.completed ? `Mark ${task.text} as active` : `Complete ${task.text}`);
        check.setAttribute('aria-pressed', String(task.completed));
        if (task.completed) check.append(iconCheck());

        const text = document.createElement('span');
        text.className = 'task-text';
        text.textContent = task.text;

        const remove = document.createElement('button');
        remove.className = 'delete';
        remove.type = 'button';
        remove.setAttribute('aria-label', `Delete ${task.text}`);
        const trash = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        trash.setAttribute('viewBox', '0 0 24 24');
        trash.setAttribute('fill', 'none');
        trash.setAttribute('stroke', 'currentColor');
        trash.setAttribute('stroke-width', '1.8');
        trash.setAttribute('stroke-linecap', 'round');
        trash.setAttribute('stroke-linejoin', 'round');
        trash.setAttribute('aria-hidden', 'true');
        const trashPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        trashPath.setAttribute('d', 'M4 7h16M10 11v6m4-6v6M5 7l1 13h12l1-13M9 7V4h6v3');
        trash.append(trashPath);
        remove.append(trash);

        check.addEventListener('click', () => {
          task.completed = !task.completed;
          saveTasks();
          render();
        });
        remove.addEventListener('click', () => {
          tasks = tasks.filter(entry => entry.id !== task.id);
          saveTasks();
          render();
        });
        item.append(check, text, remove);
        return item;
      }

      function render() {
        const visible = tasks.filter(task => activeFilter === 'all' || (activeFilter === 'active' ? !task.completed : task.completed));
        list.replaceChildren();
        if (!visible.length) {
          const empty = document.createElement('li');
          empty.className = 'empty';
          const icon = document.createElement('div');
          icon.className = 'empty-icon';
          icon.setAttribute('aria-hidden', 'true');
          icon.textContent = activeFilter === 'completed' ? '🌱' : tasks.length ? '🎉' : '📝';
          const heading = document.createElement('strong');
          heading.textContent = activeFilter === 'completed' ? 'Nothing completed just yet' : tasks.length ? 'All caught up!' : 'Your list is a blank page';
          const message = document.createElement('p');
          message.textContent = activeFilter === 'completed' ? 'Finish a task and it will show up here.' : tasks.length ? 'Enjoy the breathing room.' : 'Add a task above to get started.';
          empty.append(icon, heading, message);
          list.append(empty);
        } else {
          visible.forEach(task => list.append(makeTask(task)));
        }
        const remaining = tasks.filter(task => !task.completed).length;
        count.textContent = `${remaining} ${remaining === 1 ? 'task' : 'tasks'} left`;
        clearButton.disabled = !tasks.some(task => task.completed);
        filters.forEach(button => button.setAttribute('aria-pressed', String(button.dataset.filter === activeFilter)));
      }

      form.addEventListener('submit', event => {
        event.preventDefault();
        const text = input.value.trim();
        if (!text) { input.focus(); return; }
        tasks.unshift({ id: globalThis.crypto?.randomUUID?.() || `${Date.now()}-${Math.random().toString(36).slice(2)}`, text, completed: false });
        saveTasks();
        input.value = '';
        activeFilter = 'all';
        render();
        input.focus();
      });

      filters.forEach(button => button.addEventListener('click', () => {
        activeFilter = button.dataset.filter;
        render();
      }));

      clearButton.addEventListener('click', () => {
        tasks = tasks.filter(task => !task.completed);
        saveTasks();
        render();
      });

      render();
    })();
  </script>
</body>
</html>
